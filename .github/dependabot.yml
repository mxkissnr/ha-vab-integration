version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # github/codeql-action's init/analyze/upload-sarif sub-actions ship from
      # one release train and must stay version-matched, or the Analyze job
      # fails on the mismatch -- bump them together instead of one PR per
      # sub-action.
      github-actions:
        patterns:
          - "*"
